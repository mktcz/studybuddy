name: studybuddy
description: "StudyBuddy — a subject-centric study workspace with wearable-backed focus sessions."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  flutter:
    sdk: flutter


  ui:
    path: ../packages/ui


  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0


  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.5
  path: ^1.9.1
  path_provider: ^2.1.6


  pdfrx: ^2.4.7


  home_widget: ^0.9.3


  synheart_core: ^0.12.0
  synheart_session: ^0.2.0

  intl: ^0.20.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  sqlite3: ^3.5.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
